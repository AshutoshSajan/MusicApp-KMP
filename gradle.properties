#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx4096M"
# NOTE: do not hardcode org.gradle.java.home here — CI runners provide JDK 17 via actions/setup-java.
# If you need a local JDK override, export ORG_GRADLE_PROJECT_org.gradle.java.home or pass
# -Dorg.gradle.java.home=... on the command line instead.
#Kotlin
kotlin.code.style=official
#Android
android.useAndroidX=true
android.nonTransitiveRClass=true
android.builtInKotlin=false
android.newDsl=false
#MPP
kotlin.mpp.enableCInteropCommonization=true
org.jetbrains.compose.experimental.uikit.enabled=true
org.jetbrains.compose.experimental.jscanvas.enabled=true
org.jetbrains.compose.experimental.macos.enabled=true
xcodeproj=iosApp
kotlin.native.cocoapods.generate.wrapper=true
kotlin.js.ir.output.granularity=whole-program