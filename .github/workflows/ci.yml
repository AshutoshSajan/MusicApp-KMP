name: CI — verify (cloud only)

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=true"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest runners already ship an Android SDK (ANDROID_SDK_ROOT).
      # Install the API-36 packages this project compiles against (compileSdk 36)
      # and accept licenses. Split into small steps so a failure names its cause.
      - name: Show Android SDK state
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --list_installed

      - name: Install Android platform + build-tools (API 36)
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Lightweight gate: shared tests + Android debug. Full per-OS packaging
      # happens in release.yml (tag-triggered) to save CI minutes.
      - name: Run shared checks + Android debug build
        run: ./gradlew :shared:check :androidApp:assembleDebug --no-daemon --stacktrace
