name: CI — verify (cloud only)

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=true"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest runners already ship an Android SDK (ANDROID_SDK_ROOT).
      # Install the API-37 packages this project compiles against (compileSdk 37)
      # and accept licenses — no third-party action needed.
      - name: Install Android SDK packages (API 37)
        run: |
          : "${ANDROID_SDK_ROOT:?ANDROID_SDK_ROOT is not set on this runner}"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --install "platforms;android-37" "build-tools;37.0.0" "platform-tools"
          yes | "$SDKMANAGER" --licenses > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Lightweight gate: shared tests + Android debug. Full per-OS packaging
      # happens in release.yml (tag-triggered) to save CI minutes.
      - name: Run shared checks + Android debug build
        run: ./gradlew :shared:check :androidApp:assembleDebug --no-daemon --stacktrace
