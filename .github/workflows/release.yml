name: Release — Android/Desktop/Web (cloud only, unsigned)

# Nothing is built locally. Push a tag like v1.0.0 and GitHub Actions
# builds Android / Desktop (Linux+Windows) / Web (unsigned) and attaches
# everything to a GitHub Release. Manual run via workflow_dispatch.
# macOS desktop + iOS builds are disabled (no Apple runners/certs).
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=true"

jobs:
  android:
    name: Android (APK + AAB, unsigned/debug-signed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest runners already ship an Android SDK (ANDROID_SDK_ROOT).
      # This project compiles against API 37, which Google publishes as
      # `platforms;android-37.0` (minor-version scheme; the integer
      # `platforms;android-37` does not exist). AGP looks up `android-37`,
      # so symlink it. Split into small steps so a failure names its cause.
      - name: Show Android SDK state
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --list_installed

      - name: Install Android platform + build-tools (API 37)
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
          PLATFORMS="$ANDROID_SDK_ROOT/platforms"
          if [ ! -e "$PLATFORMS/android-37" ]; then ln -s android-37.0 "$PLATFORMS/android-37"; fi
          ls -la "$PLATFORMS" | grep 37

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK + AAB (no keystore → debug-signed)
        run: ./gradlew :androidApp:assembleRelease :androidApp:bundleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: androidApp/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: androidApp/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  web:
    name: Web (Kotlin/JS browser distribution)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The checked-in kotlin-js-store/yarn.lock is stale relative to current
      # dependency versions, so the plugin's lockfile check would fail.
      # Regenerate it in-workspace (cloud only, nothing committed).
      - name: Refresh Kotlin/JS yarn lock
        run: ./gradlew kotlinUpgradeYarnLock --no-daemon --stacktrace

      - name: Build web distribution
        run: ./gradlew :webApp:jsBrowserDistribution --no-daemon --stacktrace

      - name: Zip web dist
        run: |
          cd webApp/build/dist/js/productionExecutable
          zip -r "$GITHUB_WORKSPACE/web-dist.zip" .
          ls -la "$GITHUB_WORKSPACE/web-dist.zip"

      - name: Upload web dist (folder)
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: webApp/build/dist/js/productionExecutable
          if-no-files-found: error

      - name: Upload web zip
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-zip
          path: web-dist.zip
          if-no-files-found: error

  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build native package for current OS + portable distributable
        run: ./gradlew :desktopApp:packageDistributionForCurrentOS :desktopApp:createDistributable --no-daemon --stacktrace

      - name: List produced packages
        shell: bash
        run: find desktopApp/build/compose/binaries -maxdepth 4 -type f | head -n 50

      # The Compose Gradle plugin has no AppImage target, so wrap the portable
      # distributable (bundled JRE + launcher) into an AppImage with appimagetool.
      # Linux-only: AppImages are built on the oldest runner (ubuntu) for max glibc compat.
      - name: Build AppImage for Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          DIST="$(find desktopApp/build/compose/binaries/main/app -maxdepth 1 -mindepth 1 -type d | head -n 1)"
          echo "Distributable: $DIST"
          LAUNCHER="$(basename "$(find "$DIST/bin" -maxdepth 1 -mindepth 1 | head -n 1)")"
          echo "Launcher: $LAUNCHER"
          rm -rf AppDir
          mkdir -p AppDir/usr
          cp -r "$DIST/." AppDir/usr/
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/usr/bin/%s" "$@"\n' "$LAUNCHER" > AppDir/AppRun
          chmod +x AppDir/AppRun
          cat > "AppDir/${LAUNCHER}.desktop" <<DESKTOP
          [Desktop Entry]
          Type=Application
          Name=MusicApp-KMP
          Exec=${LAUNCHER}
          Icon=musicapp
          Comment=Music player built with Compose Multiplatform
          Categories=AudioVideo;Audio;Player;
          Terminal=false
          DESKTOP
          # Placeholder icon (repo ships no artwork yet): green rounded square + note.
          # Replace AppDir/musicapp.svg with real artwork when available.
          cat > AppDir/musicapp.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
            <rect x="8" y="8" width="240" height="240" rx="52" fill="#121212"/>
            <rect x="8" y="8" width="240" height="240" rx="52" fill="none" stroke="#1DB954" stroke-width="10"/>
            <ellipse cx="92" cy="186" rx="30" ry="24" fill="#1DB954"/>
            <ellipse cx="180" cy="172" rx="30" ry="24" fill="#1DB954"/>
            <rect x="112" y="70" width="14" height="120" fill="#1DB954"/>
            <rect x="200" y="56" width="14" height="120" fill="#1DB954"/>
            <polygon points="112,70 214,56 214,84 112,98" fill="#1DB954"/>
          </svg>
          SVG
          wget -q "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" -O appimagetool.AppImage
          chmod +x appimagetool.AppImage
          mkdir -p desktopApp/build/compose/binaries/main/appimage
          # No FUSE on GitHub runners -> extract-and-run mode
          APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool.AppImage AppDir "desktopApp/build/compose/binaries/main/appimage/MusicApp-KMP-x86_64.AppImage"
          ls -la desktopApp/build/compose/binaries/main/appimage/

      - name: Upload native packages
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: desktopApp/build/compose/binaries/main/**/*
          if-no-files-found: error

  github-release:
    name: Publish GitHub Release
    needs: [android, web, desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Pack desktop + debug info for release assets
        run: |
          ls -R ./artifacts | head -n 100
          cd ./artifacts
          for d in desktop-ubuntu-latest desktop-windows-latest; do
            if [ -d "$d" ]; then (cd "$d" && zip -r "../$d.zip" .) fi
          done
          if [ -d web-dist ]; then (cd web-dist && zip -r ../web-dist-folder.zip .) fi
          ls -la .

      - name: Create GitHub Release with all assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/android-apk/*.apk
            artifacts/android-aab/*.aab
            artifacts/web-dist-zip/*.zip
            artifacts/web-dist-folder.zip
            artifacts/desktop-ubuntu-latest.zip
            artifacts/desktop-ubuntu-latest/appimage/*.AppImage
            artifacts/desktop-windows-latest.zip
          generate_release_notes: true
          # NOTE: Android APK/AAB without a keystore are debug-signed and NOT
          # Play-Store ready. macOS desktop + iOS builds are disabled.
          # Desktop artifacts are unsigned native installers per-OS.
